spring:
  application:
    name: mood-rec-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/moodrec}
    username: ${DB_USER:moodrec}
    password: ${DB_PASS:moodrec}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:super-secret-key-change-in-production-min-32-chars}
  expiration-ms: 86400000  # 24h

ml-service:
  base-url: ${ML_SERVICE_URL:http://localhost:8000}
  timeout-seconds: 30

external-apis:
  tmdb:
    base-url: https://api.themoviedb.org/3
    api-key: 0fd4eb9ea6f5be9e82ab885e20de0e5b
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:your_client_id}
    client-secret: ${SPOTIFY_CLIENT_SECRET:your_client_secret}
    token-url: https://accounts.spotify.com/api/token
    base-url: https://api.spotify.com/v1

logging:
  level:
    com.moodrec: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
