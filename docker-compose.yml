version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: moodrec-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       moodrec
      POSTGRES_USER:     moodrec
      POSTGRES_PASSWORD: moodrec_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moodrec"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python ML Service ───────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      target: production
    container_name: moodrec-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # model loading takes time

  # ── Spring Boot Backend ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: moodrec-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL:              jdbc:postgresql://postgres:5432/moodrec
      DB_USER:             moodrec
      DB_PASS:             moodrec_dev
      JWT_SECRET:          dev-secret-key-change-in-production-32chars
      ML_SERVICE_URL:      http://ml-service:8000
      TMDB_API_KEY:        ${TMDB_API_KEY:-your_tmdb_key_here}
      SPOTIFY_CLIENT_ID:   ${SPOTIFY_CLIENT_ID:-your_spotify_client_id}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-your_spotify_client_secret}
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: moodrec-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  default:
    name: moodrec-network
